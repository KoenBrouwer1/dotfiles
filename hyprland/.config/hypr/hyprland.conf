source = /home/koenlinux/.config/hypr/themes/catppuccin/catppuccin.conf
source = /home/koenlinux/.config/hypr/themes/catppuccin/catppuccin.conf

layerrule = blur, wofi

xwayland {
  force_zero_scaling = true
}

################
### MONITORS ###
################

monitor=eDP-1,2880x1800@120, 1920x0,auto

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$moviebrowser = brave-browser
$browser = flatpak run app.zen_browser.zen
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = nm-applet & blueman-applet
#exec-once = waybar & $terminal
#exec-once = waybar
exec-once = ~/.local/bin/bright-notify.sh
exec-once = ~/.local/bin/vol-notify.sh
exec-once = swww-daemon
exec-once = wal -R

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = STEAM_FORCE_DESKTOPUI_SCALING,2
env = GDK_SCALE,2
env = PATH,$PATH:/home/koenlinux/.local/bin

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in =7
    gaps_out = 15
    border_size = 1
#    col.active_border = rgba(f5c2e7ff)
#    col.inactive_border = rgba(45475aaa)
#    col.active_border = none
#    col.inactive_border = none
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 15
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        color = rgba(0000007a)
        color_inactive = rgba(0000004a)
        render_power = 3
        color = rgba(1a1a1aee)
        sharp = false
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.1696
    }
}

layerrule = blur, waybar
layerrule = ignorezero, waybar

animations {
    enabled = yes, please :)
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 7, default

    bezier=overshot,0.05,0.9,0.1,1.1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation = windowsMove, 1, 5, myBezier
    animation = windowsOut, 1, 5, myBezier
    animation = fade, 1, 5, default
    animation=workspaces,1,4,overshot,slidevert}
  }
windowrule = float, class:^(floating-popup)$
windowrule = size 600 400, class:^(floating-popup)$
windowrule = center, class:^(floating-popup)
windowrulev2 = fullscreen, class:^(steam_app_.*)$

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = false
    disable_hyprland_qtutils_check = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, N, exec, $moviebrowser
bind = $mainMod, TAB, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, W, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, L, exec, hyprlock

bind = , PRINT, exec, bash -c "f=~/Pictures/\$(date +%Y%m%d_%H%M%S).png; grim \$f && wl-copy < \$f"
bind = $mainMod, PRINT, exec, hyprshot -m region
#bind = , PRINT, exec, hyprshot -m output
#bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod SHIFT, W, exec, bash /home/koenlinux/.config/hypr/scripts/wallpaper.sh

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
