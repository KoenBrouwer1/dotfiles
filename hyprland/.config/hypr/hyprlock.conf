label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = rgba(245, 194, 231, 1)
  font_size = 120
  font_family = JetBrainsMono Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %d %B")"
  color = rgba(245, 194, 231, 0.6)
  font_size = 32
  font_family = JetBrainsMono Nerd Font
  position = 0, 40
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 400, 60
  outline_thickness = 3
  dots_size = 0.25
  dots_spacing = 0.3
  outer_color = rgba(245, 194, 231, 0.4)
  inner_color = rgba(26, 26, 26, 0.8)
  font_color = rgba(245, 194, 231, 1)
  fade_on_empty = true
  placeholder_text = <i>password</i>
  check_color = rgba(137, 180, 250, 1)
  fail_color = rgba(243, 139, 168, 1)
  fail_text = <i>wrong</i>
  position = 0, -200
  halign = center
  valign = center
}
