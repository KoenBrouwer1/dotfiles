include current-theme.conf
listen_on unix:/tmp/kitty
allow_remote_control yes
# Font
font_size 14.0
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
adjust_line_height 1

# Window appearance
background_opacity 0.8
window_padding_width 5
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 1400
initial_window_height 900

# Cursor
cursor_shape beam
cursor_beam_thickness 8
cursor_blink_interval 0.5
cursor_trail 1

# Keybindings
# map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+r load_config_file
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+tab next_tab
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+f toggle_fullscreen
map ctrl+q quit
map ctrl+left previous_tab
map ctrl+right next_tab

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 0.0
# tab_bar_margin_height 10.0 0.0
tab_bar_min_tabs 2
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title}"
#active_tab_foreground #1a1a1a
#active_tab_background #f5c2e7
active_tab_font_style bold-italic
#inactive_tab_foreground #bac2de
#inactive_tab_background #45475a
inactive_tab_font_style normal

# Disable annoying bells
enable_audio_bell no
visual_bell_duration 0.0

# Performance
sync_to_monitor yes
repaint_delay 10
input_delay 3
