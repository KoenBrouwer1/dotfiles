include active-theme.conf
# Font
font_size 14.0
# font_family Jetbrains Mono
adjust_line_height 1

# Window appearance
background_opacity 0.8
window_padding_width 10
#hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 1400
initial_window_height 900
dim_opacity 1.0
# Cursor
cursor_shape beam
cursor_beam_thickness 8
cursor #f5c2e7
cursor_text_color #1e1e2e
cursor_blink_interval 0.5

# Keybindings
map ctrl+v paste_from_clipboard
map ctrl+shift+r load_config_file
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+tab next_tab
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+f toggle_fullscreen
map ctrl+q quit
map ctrl+left previous_tab
map ctrl+right next_tab

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 0.0
tab_bar_min_tabs 2
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title}"
active_tab_foreground #1e1e2e
active_tab_background #f5c2e7
active_tab_font_style bold-italic
inactive_tab_foreground #bac2de
inactive_tab_background #45475a
inactive_tab_font_style normal

# Disable annoying bells
enable_audio_bell no
visual_bell_duration 0.0

# Performance
sync_to_monitor yes
repaint_delay 10
input_delay 3

# Colors — Catppuccin Mocha
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

color0  #45475a
color8  #ffffff
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8


# BEGIN_KITTY_FONTS
font_family      family='JetBrains Mono' postscript_name=JetBrainsMono-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
